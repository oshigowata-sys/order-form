<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受注一覧 | MeguRee</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f3ee;--surface:#fff;--border:#e2d9ce;
  --orange:#e8630a;--orange-light:#f97316;--orange-pale:#fff4ec;
  --green:#1e6641;--green-pale:#e8f5ee;
  --yellow:#d97706;--yellow-pale:#fffbeb;
  --text:#1a1208;--text-muted:#7a6a55;
  --sidebar-bg:#1a1208;--sidebar-text:#e8d5bc;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:240px;min-height:100vh;background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo img{width:140px;margin-bottom:4px;display:block}
.sidebar-logo-sub{font-size:10px;color:rgba(232,213,188,0.4);letter-spacing:2px;}
.sidebar-nav{padding:16px 12px;flex:1}
.nav-label{font-size:10px;color:rgba(232,213,188,0.3);letter-spacing:2px;padding:0 12px;margin-bottom:8px;margin-top:16px}
.nav-label:first-child{margin-top:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--sidebar-text);font-size:14px;font-weight:500;transition:all 0.2s;text-decoration:none;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,0.06)}
.nav-item.active{background:var(--orange);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:14px;color:var(--text-muted);margin-top:2px}
.content{padding:28px 32px;flex:1}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden}
.filter-tabs{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--border);align-items:center}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:7px 14px}
.search-box input{border:none;background:none;outline:none;font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);width:200px}
.search-box input::placeholder{color:var(--text-muted)}
.search-box:focus-within{border-color:var(--orange)}
.tab{padding:6px 14px;border-radius:100px;font-size:14px;font-weight:500;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;color:var(--text-muted)}
.tab.active{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.tab:hover:not(.active){border-color:var(--orange);color:var(--orange)}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--bg);border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-size:14px;font-weight:700;color:var(--text-muted);letter-spacing:1px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg)}
td{padding:13px 14px;font-size:14px;vertical-align:middle;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:14px;font-weight:600}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-new{background:var(--orange-pale);color:var(--orange);border:1px solid rgba(232,99,10,0.2)}
.badge-new::before{background:var(--orange)}
.badge-processing{background:var(--yellow-pale);color:var(--yellow);border:1px solid rgba(217,119,6,0.2)}
.badge-processing::before{background:var(--yellow)}
.badge-shipped{background:var(--green-pale);color:var(--green);border:1px solid rgba(30,102,65,0.2)}
.badge-shipped::before{background:var(--green)}
.status-sel{border-radius:20px;font-size:14px;font-weight:600;padding:4px 10px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;outline:none;-webkit-appearance:none;appearance:none;transition:box-shadow 0.2s}
.status-sel.s-new{background:var(--orange-pale);color:var(--orange);border:1px solid rgba(232,99,10,0.2)}
.status-sel.s-processing{background:var(--yellow-pale);color:var(--yellow);border:1px solid rgba(217,119,6,0.2)}
.status-sel.s-shipped{background:var(--green-pale);color:var(--green);border:1px solid rgba(30,102,65,0.2)}
.status-sel.saved{box-shadow:0 0 0 2px var(--green)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:20px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.06);transition:box-shadow 0.2s}
.kpi-card:hover{box-shadow:0 8px 28px rgba(0,0,0,0.1)}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 16px 0 80px;opacity:.08;background:var(--orange)}
.kpi-card.green::before{background:var(--green)}
.kpi-card.yellow::before{background:var(--yellow)}
.kpi-card.blue::before{background:#3b82f6}
.kpi-label{font-size:14px;color:var(--text-muted);font-weight:600;margin-bottom:6px;letter-spacing:0.5px;}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--text);line-height:1.2}
.kpi-value.warn{color:var(--orange)}
.kpi-value.green{color:var(--green)}
.kpi-sub{font-size:14px;color:var(--text-muted);margin-top:4px}
.topbar-user{display:flex;align-items:center;gap:10px}
.topbar-user-name{font-size:14px;font-weight:600;color:var(--text)}
.topbar-user-role{font-size:14px;color:var(--text-muted)}
.topbar-avatar{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.num-right{text-align:right}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif}
.btn:hover{opacity:0.85}
.btn-primary{background:var(--orange);color:#fff}
.btn-outline{background:var(--surface);border:1.5px solid var(--orange);color:var(--orange)}
.btn-sm{padding:5px 12px;font-size:14px;border-radius:8px}
/* モーダル */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:860px;max-width:95vw;margin-bottom:40px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.18)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background 0.2s}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:24px 28px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.info-item label{font-size:14px;color:var(--text-muted);margin-bottom:4px;display:block;font-weight:600;letter-spacing:0.5px;}
.info-item span{font-size:14px;font-weight:600}
.items-section-title{font-size:14px;font-weight:700;color:var(--text-muted);letter-spacing:1px;margin-bottom:10px}
.badge-food{background:var(--green-pale);color:var(--green);border:1px solid rgba(30,102,65,0.3);font-size:14px;padding:2px 7px;border-radius:4px;display:inline-block}
.badge-regular{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);font-size:14px;padding:2px 7px;border-radius:4px;display:inline-block}
.modal-footer{padding:16px 28px;border-top:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
.totals{display:flex;gap:24px;font-size:14px}
.totals-item{text-align:right}
.totals-item label{display:block;font-size:14px;color:var(--text-muted);margin-bottom:2px;letter-spacing:0.5px}
.totals-item span{font-weight:700;font-size:15px;font-family:'Space Grotesk',sans-serif}
.totals-item span.highlight{color:var(--orange)}
.totals-item span.green{color:var(--green)}
.modal-btns{display:flex;gap:8px}
/* 新規受注入力モーダル */
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-group2{display:flex;flex-direction:column;gap:5px}
.form-label2{font-size:14px;font-weight:700;color:var(--text-muted);letter-spacing:0.5px;}
.form-input2{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg);outline:none;transition:border-color 0.2s}
.form-input2:focus{border-color:var(--orange);background:#fff}
.add-item-row{display:grid;grid-template-columns:1fr 80px auto;gap:10px;align-items:flex-end;margin-bottom:14px}
.search-results-wrap{max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--surface)}
.search-result-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;gap:12px}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--orange-pale)}
.search-result-name{font-weight:600;flex:1;color:var(--text)}
.search-result-code{color:var(--text-muted);font-size:13px;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.search-result-price{color:var(--orange);font-weight:700;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.search-result-empty{padding:14px;color:var(--text-muted);font-size:14px;text-align:center}
.entry-items-table{width:100%;border-collapse:collapse;margin-top:8px}
.entry-items-table th{font-size:14px;font-weight:700;color:var(--text-muted);padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--border);text-align:left;letter-spacing:0.5px}
.entry-items-table td{padding:9px 10px;font-size:14px;border-bottom:1px solid var(--border)}
.entry-items-table tr:last-child td{border-bottom:none}
.entry-total{text-align:right;padding:12px 0 4px;font-size:15px;font-weight:700}
.btn-danger-sm{background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:2px 6px}
.entry-error{color:#dc2626;font-size:14px;margin-top:4px;display:none}
.entry-error.show{display:block}

.sidebar-footer{padding:12px 12px 16px;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto}
.logout-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:rgba(232,213,188,0.5);font-size:14px;font-weight:500;transition:all 0.2s;text-decoration:none}
.logout-item:hover{background:rgba(255,69,0,0.15);color:#ff9a7a}
</style>

</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="https://raw.githubusercontent.com/oshigowata-sys/order-form/main/meguree_final%20(2).svg" alt="MeguRee">
    <div class="sidebar-logo-sub">MANAGEMENT</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">メニュー</div>
    <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span>ダッシュボード</a>
    <a class="nav-item active" href="orders.html"><span class="icon">📋</span>受注一覧</a>
    <a class="nav-item" href="invoice-list.html"><span class="icon">🧾</span>請求書管理</a>
    <a class="nav-item" href="quotation-list.html"><span class="icon">📄</span>見積書管理</a>
    <div class="nav-label">マスタ管理</div>
    <a class="nav-item" href="customer.html"><span class="icon">🏢</span>取引先マスタ</a>
    <a class="nav-item" href="products.html"><span class="icon">📦</span>商品マスタ</a>
    <a class="nav-item" href="pricing.html"><span class="icon">💹</span>掛け率管理</a>
    <div class="nav-label">その他</div>
    <a class="nav-item" href="settings.html"><span class="icon">⚙️</span>設定</a>
    <a class="nav-item" href="audit-log.html"><span class="icon">🕓</span>操作履歴</a>
  </nav>
  <div class="sidebar-footer">
    <a class="logout-item" href="#" onclick="signOut('login.html'); return false;"><span class="icon">🚪</span>ログアウト</a>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title">受注一覧</div>
      <div class="page-sub">受注データの確認・詳細を管理します</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="search-box">
        <span style="color:var(--text-muted);font-size:14px">🔍</span>
        <input type="text" id="searchInput" placeholder="取引先名・受注IDで検索..." oninput="onSearchInput(this.value)">
      </div>
      <button class="btn btn-primary" onclick="openNewOrderModal()">＋ 新規受注入力</button>
      <div class="topbar-user">
        <div>
          <div class="topbar-user-name" id="topbarUserName"></div>
          <div class="topbar-user-role" id="topbarUserRole"></div>
        </div>
        <div class="topbar-avatar" id="topbarAvatar">—</div>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">未処理件数</div>
        <div class="kpi-value warn" id="kpiPending">—</div>
        <div class="kpi-sub">新規受注 + 処理中</div>
      </div>
      <div class="kpi-card yellow">
        <div class="kpi-label">本日受注</div>
        <div class="kpi-value" id="kpiToday">—</div>
        <div class="kpi-sub">件</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">月間売上（税抜）</div>
        <div class="kpi-value green" id="kpiMonthly">—</div>
        <div class="kpi-sub">今月累計</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">総受注件数</div>
        <div class="kpi-value" id="kpiTotal">—</div>
        <div class="kpi-sub">全期間</div>
      </div>
    </div>
    <div class="card">
      <div class="filter-tabs">
        <button class="tab active" data-filter="all">すべて</button>
        <button class="tab" data-filter="新規受注">新規受注</button>
        <button class="tab" data-filter="処理中">処理中</button>
        <button class="tab" data-filter="出荷済み">出荷済み</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr>
            <th>受注ID</th><th>取引先名</th><th>受注日</th><th>ステータス</th>
            <th class="num-right">税抜金額</th><th class="num-right">消費税額</th>
            <th class="num-right">税込合計</th><th class="num-right">利益</th><th></th>
          </tr></thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">受注詳細</div>
      <div style="display:flex;align-items:center;gap:10px" id="detailHeaderActions">
        <button id="detailEditBtn" onclick="enterEditMode()"
          style="display:flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;color:var(--orange);border:1.5px solid var(--orange);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit">
          ✏️ 編集
        </button>
        <button id="detailPrintBtn" onclick="window.open('invoice.html?order_id=' + currentDetailId, '_blank')"
          style="display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit">
          🖨 納品書・請求書を発行
        </button>
        <button class="modal-close" onclick="closeDetail()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="editWarning" style="display:none"></div>
      <div class="info-grid" id="modalInfo"></div>
      <div class="items-section-title">注文商品</div>
      <div class="table-wrapper">
        <table id="modalItems"></table>
      </div>
      <div id="editAddSection" style="display:none;border-top:1px solid var(--border);margin-top:16px;padding-top:16px">
        <div class="form-label2" style="margin-bottom:10px">商品を追加</div>
        <input type="text" class="form-input2" id="editItemSearch" placeholder="🔍 商品名・商品コードで検索（クリックで即追加）" oninput="filterEditProductOptions(this.value)" style="margin-bottom:10px">
        <div id="editSearchResults" class="search-results-wrap" style="display:none"></div>
      </div>
      <div id="detailStatusSection" style="border-top:1px solid var(--border);margin-top:16px;padding-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <label class="form-label2" style="white-space:nowrap;margin:0">ステータス変更</label>
        <select class="form-input2" id="detailStatusSelect" style="width:160px">
          <option value="新規受注">新規受注</option>
          <option value="処理中">処理中</option>
          <option value="出荷済み">出荷済み</option>
        </select>
        <button class="btn btn-primary btn-sm" id="detailStatusBtn" onclick="updateOrderStatus()">保存</button>
        <span id="detailStatusMsg" style="font-size:14px;color:var(--green);display:none">✓ 変更しました</span>
      </div>
    </div>
    <div class="modal-footer">
      <div class="totals" id="modalTotals"></div>
      <div class="modal-btns" style="display:flex;align-items:center;gap:10px">
        <div id="viewModeBtns" style="display:flex;align-items:center;gap:10px">
          <button class="btn" style="background:#fff0f0;border:1px solid #fca5a5;color:#dc2626;font-size:14px" onclick="deleteOrder()">受注を削除</button>
        </div>
        <div id="editModeBtns" style="display:none;align-items:center;gap:10px">
          <button class="btn btn-outline" onclick="cancelEditMode()">キャンセル</button>
          <button class="btn btn-primary" id="saveEditBtn" onclick="saveEditMode()">💾 保存</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 新規受注入力モーダル -->
<div class="overlay" id="newOrderOverlay" onclick="if(event.target===this)closeNewOrder()">
  <div class="modal" style="width:700px">
    <div class="modal-header">
      <div class="modal-title">新規受注入力</div>
      <button class="modal-close" onclick="closeNewOrder()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group2">
          <label class="form-label2">取引先 <span style="color:#dc2626">*</span></label>
          <select class="form-input2" id="newOrderCustomer" onchange="onCustomerChange()">
            <option value="">選択してください</option>
          </select>
        </div>
        <div class="form-group2">
          <label class="form-label2">受注日 <span style="color:#dc2626">*</span></label>
          <input type="date" class="form-input2" id="newOrderDate" />
        </div>
      </div>
      <div class="form-row2">
        <div class="form-group2">
          <label class="form-label2">ステータス</label>
          <select class="form-input2" id="newOrderStatus">
            <option value="新規受注">新規受注</option>
            <option value="処理中">処理中</option>
            <option value="出荷済み">出荷済み</option>
          </select>
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px">
        <div class="form-label2" style="margin-bottom:10px">商品を追加</div>
        <input type="text" class="form-input2" id="newItemSearch" placeholder="🔍 商品名・商品コードで検索（クリックで即追加）" oninput="filterProductOptions(this.value)" style="margin-bottom:10px">
        <div id="searchResults" class="search-results-wrap" style="display:none"></div>
        <div class="add-item-row">
          <select class="form-input2" id="newItemProduct">
            <option value="">商品を選択してください</option>
          </select>
          <input type="number" class="form-input2" id="newItemQty" placeholder="数量" min="1" value="1" />
          <button class="btn btn-primary btn-sm" onclick="addNewItem()">＋ 追加</button>
        </div>
        <div class="entry-error" id="itemError">商品と数量を選択してください</div>
        <table class="entry-items-table" id="newItemsTable" style="display:none">
          <thead><tr><th>商品名</th><th style="text-align:right">数量</th><th style="text-align:right">単価</th><th style="text-align:right">小計</th><th></th></tr></thead>
          <tbody id="newItemsTbody"></tbody>
        </table>
        <div class="entry-total" id="newOrderTotal" style="display:none"></div>
      </div>
      <div class="entry-error" id="orderError" style="font-size:14px;margin-top:8px"></div>
    </div>
    <div class="modal-footer">
      <div></div>
      <div class="modal-btns">
        <button class="btn btn-outline" onclick="closeNewOrder()">キャンセル</button>
        <button class="btn btn-primary" id="saveOrderBtn" onclick="saveNewOrder()">受注を登録する</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js?v=20260510-idletimer"></script>
<script>
  // ===== ページガード =====
  checkAuth();
  const BADGE      = {'新規受注':'badge-new','処理中':'badge-processing','出荷済み':'badge-shipped'};
  const STATUS_CLS = {'新規受注':'s-new','処理中':'s-processing','出荷済み':'s-shipped'};
  const STATUSES   = ['新規受注','処理中','出荷済み'];
  const userData = JSON.parse(sessionStorage.getItem('user') || '{}');
  const { tenantId, name: userName, role: userRole } = userData;

  // Topbar user info
  const nameEl = document.getElementById('topbarUserName');
  const roleEl = document.getElementById('topbarUserRole');
  const avatarEl = document.getElementById('topbarAvatar');
  if (userName) {
    nameEl.textContent = userName;
    roleEl.textContent = userRole === 'admin' ? '管理者' : 'スタッフ';
    avatarEl.textContent = userName.charAt(0);
  }

  function sbFetch(path, options = {}) {
    return fetch(SB_URL + path, {
      ...options,
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + getAccessToken(),
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    });
  }

  let allOrders = [];
  let currentFilter = 'all';
  let currentSearch = '';

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* 受注一覧：orders + customers(名前) + order_items(金額計算用) */
  async function loadOrders() {
    document.getElementById('ordersTbody').innerHTML =
      '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)">読み込み中...</td></tr>';
    try {
      const res = await sbFetch(
        `/rest/v1/orders?tenant_id=eq.${tenantId}&select=id,order_code,order_date,status,customer_id,input_company_name,input_contact_name,customers(company_name,contact_name),order_items(quantity,unit_price,cost_price,products(is_food))&order=order_date.desc`
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      allOrders = data.map(r => {
        const items = r.order_items || [];
        const excl  = items.reduce((s, i) => s + (i.quantity * i.unit_price), 0);
        const tax   = items.reduce((s, i) => {
          const rate = i.products?.is_food ? 0.08 : 0.10;
          return s + Math.round(i.quantity * i.unit_price * rate);
        }, 0);
        const cost  = items.reduce((s, i) => s + (i.quantity * (i.cost_price || 0)), 0);
        // 取引先マスタ紐付きありなら通常表示、無ければ入力時会社名＋「（マスタ未登録）」
        const masterCompany = r.customers?.company_name || '';
        const inputCompany  = r.input_company_name || '';
        const isUnlinked    = !r.customer_id;
        const displayCompany = masterCompany
          || (inputCompany ? `${inputCompany}（マスタ未登録）` : '');
        return {
          id:       r.id,
          code:     r.order_code || r.id.slice(0,8),
          customer: displayCompany,
          customerSearch: masterCompany + ' ' + inputCompany,
          contactName: r.customers?.contact_name || r.input_contact_name || '',
          isUnlinked,
          date:     r.order_date || '',
          status:   r.status || '',
          excl,
          tax,
          incl: excl + tax,
          cost,
        };
      });
      renderOrders();
      updateKPIs();
    } catch(e) {
      console.error('受注データ取得失敗:', e);
      document.getElementById('ordersTbody').innerHTML =
        '<tr><td colspan="9" style="text-align:center;padding:20px;color:#991b1b">データ取得に失敗しました <button onclick="loadOrders()" style="margin-left:12px;padding:6px 14px;background:#dc2626;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:14px">再読み込み</button></td></tr>';
    }
  }

  function updateKPIs() {
    const today = new Date().toISOString().slice(0, 10);
    const thisMonth = today.slice(0, 7);
    const pending = allOrders.filter(o => o.status === '新規受注' || o.status === '処理中').length;
    const todayCount = allOrders.filter(o => o.date === today).length;
    const monthly = allOrders.filter(o => o.date && o.date.startsWith(thisMonth)).reduce((s, o) => s + o.excl, 0);
    document.getElementById('kpiPending').textContent = pending;
    document.getElementById('kpiToday').textContent = todayCount;
    document.getElementById('kpiMonthly').textContent = '¥' + monthly.toLocaleString();
    document.getElementById('kpiTotal').textContent = allOrders.length;
  }

  function onSearchInput(val) {
    currentSearch = val.trim();
    renderOrders();
  }

  function renderOrders() {
    const tbody = document.getElementById('ordersTbody');
    let list = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      list = list.filter(o => (o.customerSearch || o.customer).toLowerCase().includes(q) || o.code.toLowerCase().includes(q));
    }
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)">受注データがありません</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(o => {
      const profit = o.excl - o.cost;
      return `<tr>
        <td><button onclick="openDetail('${esc(o.id)}')" style="background:none;border:none;padding:0;cursor:pointer;font-family:'Space Grotesk',sans-serif;color:var(--orange);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:2px">${esc(o.code)}</button></td>
        <td style="font-weight:500">${esc(o.customer)}</td>
        <td style="color:var(--text-muted);font-size:14px">${esc(o.date)}</td>
        <td><select class="status-sel ${STATUS_CLS[o.status]||''}" onchange="patchStatus('${esc(o.id)}',this)">${STATUSES.map(s=>`<option value="${s}"${o.status===s?' selected':''}>${s}</option>`).join('')}</select></td>
        <td class="num-right" style="font-family:'Space Grotesk',sans-serif">¥${o.excl.toLocaleString()}</td>
        <td class="num-right" style="color:var(--text-muted);font-family:'Space Grotesk',sans-serif">¥${o.tax.toLocaleString()}</td>
        <td class="num-right" style="font-weight:700;font-family:'Space Grotesk',sans-serif">¥${o.incl.toLocaleString()}</td>
        <td class="num-right" style="color:var(--green);font-weight:600;font-family:'Space Grotesk',sans-serif">¥${profit.toLocaleString()}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-outline btn-sm" onclick="openDetail('${esc(o.id)}')">詳細 →</button>
          <button onclick="window.open('invoice.html?order_id=${esc(o.id)}', '_blank')"
            style="margin-left:6px;padding:5px 10px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;vertical-align:middle;font-family:inherit;white-space:nowrap">納品書発行</button>
        </td>
      </tr>`;
    }).join('');
  }

  async function patchStatus(orderId, sel) {
    const newStatus = sel.value;
    const prevStatus = sel.dataset.prev || newStatus;
    const prevIdx = STATUSES.indexOf(prevStatus);
    const newIdx = STATUSES.indexOf(newStatus);
    if (prevIdx >= 0 && newIdx >= 0 && newIdx < prevIdx) {
      const ok = confirm(`ステータスを「${prevStatus}」から「${newStatus}」に戻します。よろしいですか？`);
      if (!ok) {
        sel.value = prevStatus;
        return;
      }
    }
    sel.dataset.prev = newStatus;
    sel.className = 'status-sel ' + (STATUS_CLS[newStatus] || '');
    try {
      const res = await sbFetch(`/rest/v1/orders?id=eq.${orderId}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ status: newStatus })
      });
      if (!res.ok) throw new Error('PATCH failed');
      const order = allOrders.find(o => o.id === orderId);
      if (order) order.status = newStatus;
      updateKPIs();
      sel.classList.add('saved');
      setTimeout(() => sel.classList.remove('saved'), 1000);
    } catch(e) {
      console.error(e);
      sel.value = prevStatus;
      sel.dataset.prev = prevStatus;
      sel.className = 'status-sel ' + (STATUS_CLS[prevStatus] || '');
      alert('ステータスの更新に失敗しました');
    }
  }

  let currentDetailId = null;
  function openDetail(orderId) {
    currentDetailId = orderId;
    const o = allOrders.find(x => x.id === orderId);
    if (!o) return;
    document.getElementById('modalTitle').textContent = `受注詳細 — ${o.code}`;
    document.getElementById('modalInfo').innerHTML = [
      {label:'受注ID',    val:`<span style="font-family:'Space Grotesk',sans-serif;color:var(--orange)">${esc(o.code)}</span>`},
      {label:'取引先名',  val:esc(o.customer)},
      {label:'担当者名',  val:esc(o.contactName || '—')},
      {label:'受注日',    val:esc(o.date)},
      {label:'ステータス',val:`<span class="badge ${BADGE[o.status]||''}">${esc(o.status)}</span>`},
    ].map(x=>`<div class="info-item"><label>${x.label}</label><span>${x.val}</span></div>`).join('');
    document.getElementById('modalItems').innerHTML =
      `<thead><tr><th>商品コード</th><th>商品名</th><th class="num-right">数量</th><th class="num-right">単価</th><th class="num-right">小計</th><th>税率</th></tr></thead>
      <tbody><tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted)">読み込み中...</td></tr></tbody>`;
    document.getElementById('detailStatusSelect').value = o.status;
    document.getElementById('detailStatusMsg').style.display = 'none';
    document.getElementById('detailOverlay').classList.add('open');
    loadOrderDetail(orderId);
  }

  async function updateOrderStatus() {
    const newStatus = document.getElementById('detailStatusSelect').value;
    const btn = document.getElementById('detailStatusBtn');
    const msg = document.getElementById('detailStatusMsg');
    btn.disabled = true;
    btn.textContent = '保存中...';
    msg.style.display = 'none';
    try {
      const res = await sbFetch(`/rest/v1/orders?id=eq.${currentDetailId}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ status: newStatus })
      });
      if (!res.ok) throw new Error('PATCH failed: ' + res.status);
      const order = allOrders.find(o => o.id === currentDetailId);
      if (order) order.status = newStatus;
      renderOrders();
      updateKPIs();
      msg.style.display = 'inline';
      setTimeout(() => { msg.style.display = 'none'; }, 2500);
    } catch(e) {
      console.error('ステータス更新失敗:', e);
      alert('ステータスの更新に失敗しました。もう一度お試しください。');
    } finally {
      btn.disabled = false;
      btn.textContent = '保存';
    }
  }

  async function loadOrderDetail(orderId) {
    const o = allOrders.find(x => x.id === orderId);
    if (!o) return;
    try {
      const res = await sbFetch(
        `/rest/v1/order_items?select=quantity,unit_price,products(product_code,product_name,is_food)&order_id=eq.${orderId}`
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const items = await res.json();

      let excl = 0, tax = 0;
      const rows = items.map(it => {
        const qty     = it.quantity || 0;
        const price   = it.unit_price || 0;
        const isFood  = it.products?.is_food || false;
        const taxRate = isFood ? 0.08 : 0.10;
        const sub     = qty * price;
        excl  += sub;
        tax   += Math.round(sub * taxRate);
        return `<tr>
          <td style="font-size:14px;color:var(--text-muted)">${esc(it.products?.product_code || '—')}</td>
          <td style="font-weight:500;white-space:normal">${esc(it.products?.product_name || '—')}</td>
          <td class="num-right">${qty}</td>
          <td class="num-right">¥${price.toLocaleString()}</td>
          <td class="num-right" style="font-weight:600">¥${sub.toLocaleString()}</td>
          <td><span class="${isFood?'badge-food':'badge-regular'}">${isFood?'軽減8%':'標準10%'}</span></td>
        </tr>`;
      }).join('');

      const incl = excl + tax;
      document.getElementById('modalItems').innerHTML =
        `<thead><tr><th>商品コード</th><th>商品名</th><th class="num-right">数量</th><th class="num-right">単価</th><th class="num-right">小計</th><th>税率</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted)">明細データなし</td></tr>'}</tbody>`;
      document.getElementById('modalTotals').innerHTML = `
        <div class="totals-item"><label>税抜合計</label><span>¥${excl.toLocaleString()}</span></div>
        <div class="totals-item"><label>消費税</label><span style="color:var(--text-muted)">¥${tax.toLocaleString()}</span></div>
        <div class="totals-item"><label>税込合計</label><span class="highlight">¥${incl.toLocaleString()}</span></div>`;
    } catch(e) {
      console.error('注文明細取得失敗:', e);
      document.getElementById('modalItems').innerHTML =
        `<thead><tr><th>商品名</th><th>数量</th><th>単価</th><th>小計</th></tr></thead>
        <tbody><tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted)">明細データの取得に失敗しました</td></tr></tbody>`;
    }
  }

  function closeDetail() {
    if (editMode) {
      editMode = false;
      editItems = [];
      editAffectedInvoices = [];
      toggleEditUI(false);
    }
    document.getElementById('detailOverlay').classList.remove('open');
  }

  // ===== 受注編集モード =====
  let editMode = false;
  let editItems = [];
  let editAffectedInvoices = [];

  async function enterEditMode() {
    const o = allOrders.find(x => x.id === currentDetailId);
    if (!o) return;

    // 商品マスタ・取引先掛け率をロード
    await loadProductsForEntry();
    if (o.customer_id) {
      const pRes = await sbFetch(`/rest/v1/pricing?tenant_id=eq.${tenantId}&customer_id=eq.${o.customer_id}&select=product_id,rate`);
      allPricing = pRes.ok ? await pRes.json() : [];
    } else {
      allPricing = [];
    }

    // 既存 order_items を編集用配列にロード
    try {
      const res = await sbFetch(`/rest/v1/order_items?order_id=eq.${currentDetailId}&select=id,product_id,quantity,unit_price,cost_price,products(product_code,product_name,is_food,price)`);
      if (!res.ok) throw new Error('order_items取得失敗');
      const items = await res.json();
      editItems = items.map(it => ({
        productId: it.product_id,
        name: it.products?.product_name || '',
        productCode: it.products?.product_code || '',
        qty: it.quantity || 0,
        unitPrice: it.unit_price || 0,
        costPrice: it.cost_price || 0,
        isFood: it.products?.is_food || false,
      }));
    } catch(e) {
      console.error('編集モード初期化失敗:', e);
      alert('受注明細の読み込みに失敗しました');
      return;
    }

    // 受注期間に該当する有効請求書を取得
    editAffectedInvoices = [];
    if (o.customer_id) {
      try {
        const invRes = await sbFetch(`/rest/v1/invoices?tenant_id=eq.${tenantId}&customer_id=eq.${o.customer_id}&superseded_at=is.null&select=invoice_number,period_start,period_end&period_start=lte.${o.order_date}&period_end=gte.${o.order_date}`);
        if (invRes.ok) editAffectedInvoices = await invRes.json();
      } catch(e) { console.error('影響請求書チェック失敗:', e); }
    }

    if (editAffectedInvoices.length > 0) {
      const nums = editAffectedInvoices.map(i => i.invoice_number).join('、');
      const proceed = confirm(`この受注は既に請求書発行済みです（${nums}）。\n保存すると現在の請求書が無効になり、再発行が必要になります。\n続行しますか？`);
      if (!proceed) return;
    }

    editMode = true;
    renderEditMode();
  }

  function cancelEditMode() {
    editMode = false;
    editItems = [];
    editAffectedInvoices = [];
    toggleEditUI(false);
    loadOrderDetail(currentDetailId);
  }

  function toggleEditUI(isEdit) {
    document.getElementById('editWarning').style.display = isEdit ? 'block' : 'none';
    document.getElementById('editAddSection').style.display = isEdit ? 'block' : 'none';
    document.getElementById('detailStatusSection').style.display = isEdit ? 'none' : 'flex';
    document.getElementById('detailEditBtn').style.display = isEdit ? 'none' : 'flex';
    document.getElementById('detailPrintBtn').style.display = isEdit ? 'none' : 'flex';
    document.getElementById('viewModeBtns').style.display = isEdit ? 'none' : 'flex';
    document.getElementById('editModeBtns').style.display = isEdit ? 'flex' : 'none';
  }

  function renderEditMode() {
    toggleEditUI(true);
    const warningEl = document.getElementById('editWarning');
    if (editAffectedInvoices.length > 0) {
      warningEl.innerHTML = `<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#dc2626;font-size:14px;line-height:1.6">
        ⚠️ この受注は請求書発行済みです（${editAffectedInvoices.map(i => esc(i.invoice_number)).join('、')}）。<br>
        保存すると現在の請求書が無効化され、請求書管理画面から再発行が必要になります。
      </div>`;
    } else {
      warningEl.innerHTML = `<div style="background:#fff8e6;border:1px solid #fcd34d;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#92400e;font-size:14px;line-height:1.6">
        💡 既に印刷済みの納品書がある場合、編集後の内容とは差分が生じます。再印刷をご検討ください。
      </div>`;
    }
    document.getElementById('editItemSearch').value = '';
    document.getElementById('editSearchResults').style.display = 'none';
    document.getElementById('editSearchResults').innerHTML = '';
    renderEditItems();
  }

  function renderEditItems() {
    let excl = 0, tax = 0;
    const rows = editItems.map((it, i) => {
      const taxRate = it.isFood ? 0.08 : 0.10;
      const sub = it.qty * it.unitPrice;
      excl += sub;
      tax += Math.round(sub * taxRate);
      return `<tr>
        <td style="font-size:14px;color:var(--text-muted)">${esc(it.productCode || '—')}</td>
        <td style="font-weight:500;white-space:normal">${esc(it.name)}</td>
        <td class="num-right"><input type="number" min="1" value="${it.qty}" oninput="updateEditItemQty(${i}, this.value)" style="width:64px;padding:4px 6px;text-align:right;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--surface)"></td>
        <td class="num-right">¥${it.unitPrice.toLocaleString()}</td>
        <td class="num-right" style="font-weight:600">¥${sub.toLocaleString()}</td>
        <td><span class="${it.isFood?'badge-food':'badge-regular'}">${it.isFood?'軽減8%':'標準10%'}</span></td>
        <td><button onclick="removeEditItem(${i})" style="background:#fff0f0;border:1px solid #fca5a5;color:#dc2626;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit">✕</button></td>
      </tr>`;
    }).join('');

    document.getElementById('modalItems').innerHTML =
      `<thead><tr><th>商品コード</th><th>商品名</th><th class="num-right">数量</th><th class="num-right">単価</th><th class="num-right">小計</th><th>税率</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted)">商品を1つ以上追加してください</td></tr>'}</tbody>`;

    const incl = excl + tax;
    document.getElementById('modalTotals').innerHTML = `
      <div class="totals-item"><label>税抜合計</label><span>¥${excl.toLocaleString()}</span></div>
      <div class="totals-item"><label>消費税</label><span style="color:var(--text-muted)">¥${tax.toLocaleString()}</span></div>
      <div class="totals-item"><label>税込合計</label><span class="highlight">¥${incl.toLocaleString()}</span></div>`;
  }

  function updateEditItemQty(idx, value) {
    if (!editItems[idx]) return;
    const qty = Math.max(1, parseInt(value, 10) || 1);
    editItems[idx].qty = qty;
    // 行小計＋合計だけ部分更新（テーブル全体を再描画するとフォーカスを奪うため）
    let excl = 0, tax = 0;
    const tbody = document.querySelector('#modalItems tbody');
    editItems.forEach((it, i) => {
      const taxRate = it.isFood ? 0.08 : 0.10;
      const sub = it.qty * it.unitPrice;
      excl += sub;
      tax += Math.round(sub * taxRate);
      if (i === idx && tbody && tbody.children[i]) {
        const subCell = tbody.children[i].children[4];
        if (subCell) subCell.textContent = '¥' + sub.toLocaleString();
      }
    });
    const incl = excl + tax;
    document.getElementById('modalTotals').innerHTML = `
      <div class="totals-item"><label>税抜合計</label><span>¥${excl.toLocaleString()}</span></div>
      <div class="totals-item"><label>消費税</label><span style="color:var(--text-muted)">¥${tax.toLocaleString()}</span></div>
      <div class="totals-item"><label>税込合計</label><span class="highlight">¥${incl.toLocaleString()}</span></div>`;
  }

  function removeEditItem(idx) {
    editItems.splice(idx, 1);
    renderEditItems();
  }

  function filterEditProductOptions(q) {
    const raw = (q || '').trim();
    const query = normalizeSearch(raw);
    const filtered = query
      ? allProducts.filter(p =>
          normalizeSearch(p.product_name).includes(query) ||
          (p.product_code || '').toLowerCase().includes(query.toLowerCase())
        )
      : allProducts;
    renderEditSearchResults(raw, filtered);
  }

  function renderEditSearchResults(query, list) {
    const wrap = document.getElementById('editSearchResults');
    if (!wrap) return;
    if (!query) {
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      return;
    }
    wrap.style.display = 'block';
    if (!list || list.length === 0) {
      wrap.innerHTML = '<div class="search-result-empty">該当する商品がありません</div>';
      return;
    }
    wrap.innerHTML = list.map(p => `
      <div class="search-result-item" onclick="addEditItemFromSearch('${esc(p.id)}')" title="クリックで追加（数量1）">
        <span class="search-result-name">${esc(p.product_name)}</span>
        <span class="search-result-code">${p.product_code ? esc(p.product_code) : ''}</span>
        <span class="search-result-price">¥${Number(p.price || 0).toLocaleString()}</span>
      </div>
    `).join('');
  }

  function addEditItemFromSearch(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    const unitPrice = getUnitPrice(productId);
    const existing = editItems.find(i => i.productId === productId);
    if (existing) {
      existing.qty += 1;
    } else {
      editItems.push({
        productId,
        name: product.product_name,
        productCode: product.product_code || '',
        qty: 1,
        unitPrice,
        costPrice: 0,
        isFood: product.is_food || false,
      });
    }
    document.getElementById('editItemSearch').value = '';
    renderEditSearchResults('', []);
    renderEditItems();
  }

  async function saveEditMode() {
    if (editItems.length === 0) {
      alert('商品を1つ以上追加してください');
      return;
    }
    const btn = document.getElementById('saveEditBtn');
    btn.disabled = true; btn.textContent = '保存中...';

    try {
      const delRes = await sbFetch(`/rest/v1/order_items?order_id=eq.${currentDetailId}`, {
        method: 'DELETE',
        headers: { 'Prefer': 'return=minimal' }
      });
      if (!delRes.ok) throw new Error('明細削除失敗');

      await Promise.all(editItems.map(item =>
        sbFetch('/rest/v1/order_items', {
          method: 'POST',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({
            order_id: currentDetailId,
            product_id: item.productId,
            quantity: item.qty,
            unit_price: item.unitPrice,
            cost_price: item.costPrice,
            tenant_id: tenantId
          })
        }).then(r => { if (!r.ok) throw new Error('明細追加失敗'); })
      ));

      const o = allOrders.find(x => x.id === currentDetailId);
      if (o && editAffectedInvoices.length > 0) {
        const supersededAt = new Date().toISOString();
        await sbFetch(`/rest/v1/invoices?tenant_id=eq.${tenantId}&customer_id=eq.${o.customer_id}&superseded_at=is.null&period_start=lte.${o.order_date}&period_end=gte.${o.order_date}`, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ superseded_at: supersededAt })
        });
      }

      editMode = false;
      editItems = [];
      editAffectedInvoices = [];
      await loadOrders();
      toggleEditUI(false);
      loadOrderDetail(currentDetailId);
    } catch(e) {
      console.error('受注編集保存失敗:', e);
      alert('保存に失敗しました。もう一度お試しください。');
    } finally {
      btn.disabled = false; btn.textContent = '💾 保存';
    }
  }

  async function deleteOrder() {
    const o = allOrders.find(x => x.id === currentDetailId);
    if (!o) return;
    if (!confirm(`受注「${o.code}」を削除しますか？\nこの操作は取り消せません。`)) return;
    try {
      const r1 = await sbFetch(`/rest/v1/order_items?order_id=eq.${currentDetailId}`, { method: 'DELETE', headers: { 'Prefer': 'return=minimal' } });
      if (!r1.ok) throw new Error('明細削除失敗');
      const r2 = await sbFetch(`/rest/v1/orders?id=eq.${currentDetailId}`, { method: 'DELETE', headers: { 'Prefer': 'return=minimal' } });
      if (!r2.ok) throw new Error('受注削除失敗');
      allOrders = allOrders.filter(x => x.id !== currentDetailId);
      closeDetail();
      renderOrders();
      updateKPIs();
    } catch(e) {
      console.error(e);
      alert('削除に失敗しました。もう一度お試しください。');
    }
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentFilter = t.dataset.filter;
      renderOrders();
    });
  });

  // ===== 新規受注入力 =====
  let newOrderItems = [];
  let allCustomers = [];
  let allProducts = [];
  let allPricing = [];

  async function openNewOrderModal() {
    newOrderItems = [];
    document.getElementById('newOrderDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('newOrderStatus').value = '新規受注';
    document.getElementById('newOrderCustomer').value = '';
    document.getElementById('newItemProduct').value = '';
    document.getElementById('newItemQty').value = '1';
    const search = document.getElementById('newItemSearch');
    if (search) search.value = '';
    renderSearchResults('', []);
    document.getElementById('itemError').classList.remove('show');
    document.getElementById('orderError').classList.remove('show');
    renderNewItems();
    document.getElementById('newOrderOverlay').classList.add('open');
    await Promise.all([loadCustomersForEntry(), loadProductsForEntry()]);
  }

  function closeNewOrder() {
    document.getElementById('newOrderOverlay').classList.remove('open');
  }

  async function loadCustomersForEntry() {
    if (allCustomers.length) return;
    const res = await sbFetch(`/rest/v1/customers?tenant_id=eq.${tenantId}&select=id,company_name&order=company_name`);
    allCustomers = await res.json();
    const sel = document.getElementById('newOrderCustomer');
    sel.innerHTML = '<option value="">選択してください</option>' +
      allCustomers.map(c => `<option value="${esc(c.id)}">${esc(c.company_name)}</option>`).join('');
  }

  async function loadProductsForEntry() {
    if (!allProducts.length) {
      const res = await sbFetch(`/rest/v1/products?tenant_id=eq.${tenantId}&select=id,product_name,product_code,price,is_food&order=product_name`);
      allProducts = await res.json();
    }
    renderProductOptions(allProducts);
  }

  function renderProductOptions(list) {
    const sel = document.getElementById('newItemProduct');
    const products = list || allProducts;
    const prevValue = sel.value;
    sel.innerHTML = '<option value="">商品を選択してください</option>' +
      products.map(p => `<option value="${esc(p.id)}">${esc(p.product_name)}${p.product_code ? ' (' + esc(p.product_code) + ')' : ''}</option>`).join('');
    if (prevValue && products.find(p => p.id === prevValue)) {
      sel.value = prevValue;
    }
  }

  // 検索用文字列正規化（lowercase + カタカナ→ひらがな統一）
  // 例: "ホタテ" と "ほたて" は同じキーになる
  function normalizeSearch(s) {
    return String(s || '').toLowerCase()
      .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }

  function filterProductOptions(q) {
    const raw = (q || '').trim();
    const query = normalizeSearch(raw);
    const filtered = query
      ? allProducts.filter(p =>
          normalizeSearch(p.product_name).includes(query) ||
          (p.product_code || '').toLowerCase().includes(query.toLowerCase())
        )
      : allProducts;
    // プルダウンは検索窓と独立（常に全商品を保持）→ 絞り込まない
    renderSearchResults(raw, filtered);
  }

  function renderSearchResults(query, list) {
    const wrap = document.getElementById('searchResults');
    if (!wrap) return;
    if (!query) {
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      return;
    }
    wrap.style.display = 'block';
    if (!list || list.length === 0) {
      wrap.innerHTML = '<div class="search-result-empty">該当する商品がありません</div>';
      return;
    }
    wrap.innerHTML = list.map(p => `
      <div class="search-result-item" onclick="addItemFromSearch('${esc(p.id)}')" title="クリックで追加（数量1）">
        <span class="search-result-name">${esc(p.product_name)}</span>
        <span class="search-result-code">${p.product_code ? esc(p.product_code) : ''}</span>
        <span class="search-result-price">¥${Number(p.price || 0).toLocaleString()}</span>
      </div>
    `).join('');
  }

  function addItemFromSearch(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    const unitPrice = getUnitPrice(productId);
    const existing = newOrderItems.find(i => i.productId === productId);
    if (existing) {
      existing.qty += 1;
    } else {
      newOrderItems.push({ productId, name: product.product_name, qty: 1, unitPrice, costPrice: 0 });
    }
    // 検索窓と候補リストはリセット（プルダウンは絞り込んでないので触らない）
    const search = document.getElementById('newItemSearch');
    if (search) search.value = '';
    renderSearchResults('', []);
    document.getElementById('itemError').classList.remove('show');
    renderNewItems();
  }

  async function onCustomerChange() {
    const customerId = document.getElementById('newOrderCustomer').value;
    if (!customerId) { allPricing = []; return; }
    const res = await sbFetch(`/rest/v1/pricing?tenant_id=eq.${tenantId}&customer_id=eq.${customerId}&select=product_id,rate`);
    allPricing = await res.json();
  }

  function getUnitPrice(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return 0;
    const pricing = allPricing.find(p => p.product_id === productId);
    if (pricing) return Math.round(product.price * pricing.rate);
    return product.price;
  }

  function addNewItem() {
    const productId = document.getElementById('newItemProduct').value;
    const qty = parseInt(document.getElementById('newItemQty').value, 10);
    const errEl = document.getElementById('itemError');
    if (!productId || !qty || qty < 1) { errEl.classList.add('show'); return; }
    errEl.classList.remove('show');
    const product = allProducts.find(p => p.id === productId);
    const unitPrice = getUnitPrice(productId);
    const existing = newOrderItems.find(i => i.productId === productId);
    if (existing) {
      existing.qty += qty;
    } else {
      newOrderItems.push({ productId, name: product.product_name, qty, unitPrice, costPrice: 0 });
    }
    document.getElementById('newItemProduct').value = '';
    document.getElementById('newItemQty').value = '1';
    const search = document.getElementById('newItemSearch');
    if (search) {
      search.value = '';
      renderSearchResults('', []);
    }
    renderNewItems();
  }

  function updateNewItemQty(idx, value) {
    if (!newOrderItems[idx]) return;
    const qty = Math.max(1, parseInt(value, 10) || 1);
    newOrderItems[idx].qty = qty;
    // 行小計セルだけ書き換え（テーブル全体を再描画しない＝入力フォーカスを奪わない）
    const subCell = document.querySelector(`[data-newitem-sub="${idx}"]`);
    if (subCell) {
      subCell.textContent = '¥' + (qty * newOrderItems[idx].unitPrice).toLocaleString();
    }
    // 合計も部分更新
    const total = newOrderItems.reduce((sum, it) => sum + it.qty * it.unitPrice, 0);
    const totalEl = document.getElementById('newOrderTotal');
    if (totalEl) {
      totalEl.innerHTML = `税抜合計 <span style="color:var(--orange);font-family:'Space Grotesk',sans-serif">¥${total.toLocaleString()}</span>`;
    }
  }

  function removeNewItem(index) {
    newOrderItems.splice(index, 1);
    renderNewItems();
  }

  function renderNewItems() {
    const tbody = document.getElementById('newItemsTbody');
    const table = document.getElementById('newItemsTable');
    const totalEl = document.getElementById('newOrderTotal');
    if (newOrderItems.length === 0) { table.style.display = 'none'; totalEl.style.display = 'none'; return; }
    table.style.display = 'table';
    totalEl.style.display = 'block';
    let total = 0;
    tbody.innerHTML = newOrderItems.map((item, i) => {
      const sub = item.qty * item.unitPrice;
      total += sub;
      return `<tr>
        <td style="white-space:normal">${esc(item.name)}</td>
        <td style="text-align:right"><input type="number" min="1" value="${item.qty}" oninput="updateNewItemQty(${i}, this.value)" style="width:64px;padding:4px 6px;text-align:right;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--surface)"></td>
        <td style="text-align:right">¥${item.unitPrice.toLocaleString()}</td>
        <td style="text-align:right;font-weight:600" data-newitem-sub="${i}">¥${sub.toLocaleString()}</td>
        <td><button class="btn-danger-sm" onclick="removeNewItem(${i})">✕</button></td>
      </tr>`;
    }).join('');
    totalEl.innerHTML = `税抜合計 <span style="color:var(--orange);font-family:'Space Grotesk',sans-serif">¥${total.toLocaleString()}</span>`;
  }

  async function saveNewOrder() {
    const customerId = document.getElementById('newOrderCustomer').value;
    const orderDate  = document.getElementById('newOrderDate').value;
    const status     = document.getElementById('newOrderStatus').value;
const errEl      = document.getElementById('orderError');
    errEl.classList.remove('show');

    if (!customerId) { errEl.textContent = '取引先を選択してください'; errEl.classList.add('show'); return; }
    if (!orderDate)  { errEl.textContent = '受注日を入力してください'; errEl.classList.add('show'); return; }
    if (newOrderItems.length === 0) { errEl.textContent = '商品を1つ以上追加してください'; errEl.classList.add('show'); return; }

    const btn = document.getElementById('saveOrderBtn');
    btn.disabled = true; btn.textContent = '登録中...';

    try {
      const code = 'M-' + orderDate.replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000);
      const orderRes = await sbFetch('/rest/v1/orders', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify({ order_code: code, customer_id: customerId, order_date: orderDate, status, tenant_id: tenantId })
      });
      if (!orderRes.ok) throw new Error('order POST failed');
      const orderData = await orderRes.json();
      const orderId = orderData[0]?.id;

      await Promise.all(newOrderItems.map(item =>
        sbFetch('/rest/v1/order_items', {
          method: 'POST',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ order_id: orderId, product_id: item.productId, quantity: item.qty, unit_price: item.unitPrice, cost_price: item.costPrice, tenant_id: tenantId })
        })
      ));

      closeNewOrder();
      await loadOrders();
    } catch(e) {
      console.error(e);
      errEl.textContent = '登録に失敗しました。もう一度お試しください。';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false; btn.textContent = '受注を登録する';
    }
  }

  loadOrders();
</script>
<script src="mobile.js"></script>
</body>
</html>
