<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="favicon-192.png">
<meta name="robots" content="noindex">
<title>注文フォーム | MeguRee</title>
<!--
  ログイン制移行（2026-06）により、ログイン不要の注文フォームは廃止しました。
  注文はログイン式の画面（login.html → shop.html）に一本化されています。
  このページは旧URLへのアクセスをログイン画面へ転送するためだけに残しています。
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP',sans-serif;background:#f5f0eb;color:#1c1409;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#fff;border:1px solid #e2d9ce;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.07);max-width:420px;width:100%;padding:36px 28px;text-align:center}
  .box img{width:160px;margin-bottom:18px}
  h1{font-size:18px;font-weight:700;margin-bottom:10px}
  p{font-size:14px;color:#8c7355;line-height:1.8;margin-bottom:22px}
  a.btn{display:inline-block;background:#e8630a;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:10px}
</style>
<script>
  // 3秒後に自動でログイン画面へ。即時に飛ばすとブラウザ履歴で戻りにくくなるため軽く待つ。
  setTimeout(function(){ location.replace('login.html'); }, 3000);
</script>
</head>
<body>
  <div class="box">
    <img src="https://raw.githubusercontent.com/oshigowata-sys/order-form/main/meguree_final%20(2).svg" alt="MeguRee">
    <h1>注文はログインが必要になりました</h1>
    <p>ご注文には取引先アカウントでのログインが必要です。<br>自動でログイン画面に移動します。<br>移動しない場合は下のボタンを押してください。</p>
    <a class="btn" href="login.html">ログイン画面へ</a>
  </div>
</body>
</html>
