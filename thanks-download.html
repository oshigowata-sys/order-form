<!DOCTYPE html>
<html lang="ja">

<!-- サンキューページ：検索結果には出さない（コンバージョン確認用） -->
<meta name="robots" content="noindex,nofollow">

<title>資料ダウンロードありがとうございます | MeguRee</title>
<meta property="og:type" content="website">
<meta property="og:title" content="資料ダウンロードありがとうございます | MeguRee">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fdf6ee; --surface: #ffffff; --border: #e8d5bc;
    --orange: #e8630a; --green: #1e6641;
    --text: #1c1409; --text-muted: #8c7355; --danger: #dc2626;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: #fff; border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
  .header-sub { font-size: 12px; color: var(--text-muted); letter-spacing: 2px; }
  .hero { background: linear-gradient(135deg, #1c1409 0%, #3a2510 100%); color: #fff; padding: 56px 32px; text-align: center; }
  .hero-title { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.8; }
  .hero-orange { color: var(--orange); }
  .content { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
  .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 24px; padding: 40px; box-shadow: 0 8px 40px rgba(232,99,10,0.08); text-align: center; }
  .pdf-preview { background: #f0f7f3; border: 1px solid #b8d9c6; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 14px; }
  .pdf-icon { font-size: 32px; flex-shrink: 0; }
  .pdf-info { text-align: left; }
  .pdf-name { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 2px; }
  .pdf-size { font-size: 11px; color: var(--text-muted); }
  .success-icon { font-size: 56px; margin-bottom: 16px; }
  .success-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: var(--green); }
  .success-sub { font-size: 14px; color: var(--text-muted); line-height: 1.9; margin-bottom: 28px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn-green { display: block; padding: 14px; background: var(--green); border-radius: 12px; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; text-align: center; transition: opacity 0.2s; }
  .btn-green:hover { opacity: 0.9; }
  .btn-outline-sm { display: block; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; color: var(--text-muted); font-size: 14px; text-decoration: none; text-align: center; transition: border-color 0.2s, color 0.2s; }
  .btn-outline-sm:hover { border-color: var(--orange); color: var(--orange); }
  @media (max-width: 600px) {
    .card { padding: 24px; }
    .hero { padding: 40px 20px; }
    .hero-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <span style="font-family:'Palatino Linotype',Palatino,Georgia,serif;font-weight:700;font-size:30px;background:linear-gradient(90deg,#ff5500,#ff9900 55%,#00b850);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;line-height:1;white-space:nowrap;">MeguRee</span>
  <span class="header-sub">受注管理システム</span>
</div>

<div class="hero">
  <div class="hero-title">資料ダウンロード<span class="hero-orange">ありがとうございます</span></div>
  <div class="hero-sub">ダウンロードが自動的に始まります。</div>
</div>

<div class="content">
  <div class="card">
    <div class="pdf-preview">
      <div class="pdf-icon">📄</div>
      <div class="pdf-info">
        <div class="pdf-name">MeguRee サービス紹介資料</div>
        <div class="pdf-size">観光卸売業向け 受注管理システム・12ページ</div>
      </div>
    </div>
    <div class="success-icon">✅</div>
    <div class="success-title">ダウンロードを開始しました</div>
    <div class="success-sub">
      自動的にダウンロードが始まります。<br>
      始まらない場合は下のボタンからダウンロードしてください。
    </div>
    <div class="actions">
      <a href="assets/meguree-service-guide.pdf" download="MeguRee_サービス紹介資料.pdf" class="btn-green">
        もう一度ダウンロードする
      </a>
      <a href="contact.html" class="btn-outline-sm">導入のご相談・お問い合わせはこちら</a>
      <a href="lp.html" class="btn-outline-sm">トップページに戻る</a>
    </div>
  </div>
</div>

<script>
  // 資料PDFの自動ダウンロード開始
  (function autoDownload() {
    try {
      var a = document.createElement('a');
      a.href = 'assets/meguree-service-guide.pdf';
      a.download = 'MeguRee_サービス紹介資料.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (e) { /* ボタンからの手動ダウンロードで代替可能 */ }
  })();

  // GA4: サンキューページ到達（コンバージョン計測の着地点）。個人情報は送らない。
  if (typeof gtag === 'function') {
    gtag('event', 'thanks_view', { type: 'download', page: 'thanks-download.html' });
  }
</script>
<script src="analytics-events.js"></script>
</body>
</html>
