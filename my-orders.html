<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="favicon-192.png">
  <title>注文履歴 | MeguRee</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #e8630a; --orange-dark: #c4520a; --orange-pale: #fff4ec;
      --green: #1e6641; --green-pale: #edf7f1;
      --bg: #f5f0eb; --surface: #ffffff; --border: #e2d9ce; --border-light: #ede7de;
      --text: #1c1409; --text-muted: #8c7355; --danger: #dc2626;
      --shadow: 0 2px 16px rgba(0,0,0,0.07); --r: 14px; --r-sm: 10px;
    }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .site-header {
      background: linear-gradient(135deg, #c95407 0%, #e8630a 40%, #f97316 100%);
      color: white; padding: 14px 20px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 16px rgba(201,84,7,0.45);
    }
    .site-header .logo { height: 26px; filter: brightness(0) invert(1); flex-shrink: 0; }
    .header-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.35); flex-shrink: 0; }
    .header-text { flex: 1; min-width: 0; }
    .header-customer { font-size: 14px; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-title { font-size: 11px; opacity: 0.75; display: block; margin-top: 1px; }
    .header-btn {
      font-size: 12px; color: white; background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; padding: 6px 12px;
      cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; text-decoration: none;
      transition: background 0.15s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.3); }
    .header-switch {
      font-size: 13px; font-weight: 700; color: white; background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.45); border-radius: 8px; padding: 6px 10px;
      cursor: pointer; font-family: inherit; max-width: 180px; flex-shrink: 0; outline: none;
    }
    .header-switch option { color: var(--text); }

    .page-body { max-width: 880px; margin: 0 auto; padding: 24px 16px; }

    .order-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
    }
    .order-head {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px; flex-wrap: wrap;
    }
    .order-date { font-size: 13px; color: var(--text-muted); }
    .order-code { font-size: 13px; font-weight: 700; color: var(--text); }
    .order-status {
      font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-pale);
      border-radius: 999px; padding: 3px 10px;
    }
    .order-spacer { flex: 1; }
    .order-total { font-size: 15px; font-weight: 700; color: var(--orange); }
    .order-meta { font-size: 12px; color: var(--text-muted); }
    .order-actions { display: flex; gap: 8px; padding: 0 18px 14px; flex-wrap: wrap; }
    .btn {
      padding: 9px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text);
      transition: background 0.15s, opacity 0.2s;
    }
    .btn:hover { background: #faf8f5; }
    .btn-primary { background: var(--orange); border-color: var(--orange); color: white; box-shadow: 0 3px 10px rgba(232,99,10,0.25); }
    .btn-primary:hover { background: var(--orange-dark); }

    .empty-msg { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px; }

    /* detail modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(28,20,9,0.55); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; border-radius: 18px; max-width: 460px; width: 100%; max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
    .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: none; cursor: pointer; font-size: 15px; }
    .modal-body { padding: 8px 20px; overflow-y: auto; }
    .detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-name { flex: 1; min-width: 0; }
    .detail-qty { color: var(--text-muted); flex-shrink: 0; }
    .detail-amount { font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .modal-footer .btn { flex: 1; text-align: center; }
  </style>
</head>
<body>

<header class="site-header">
  <img src="https://raw.githubusercontent.com/oshigowata-sys/order-form/main/meguree_final%20(2).svg" alt="MeguRee" class="logo">
  <div class="header-divider"></div>
  <div class="header-text">
    <span class="header-customer" id="headerCustomer">注文履歴</span>
    <span class="header-title">これまでのご注文</span>
  </div>
  <select class="header-switch" id="wholesalerSwitch" style="display:none" onchange="switchWholesaler(this.value)" aria-label="卸業者を切り替え"></select>
  <a class="header-btn" id="orderLink" href="shop.html">注文する</a>
  <button class="header-btn" onclick="signOut('login.html')">ログアウト</button>
</header>

<div class="page-body">
  <div id="orderList"><div class="empty-msg">読み込み中...</div></div>
</div>

<!-- 明細モーダル -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="detailTitle">注文内容</div>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detailBody"><div class="empty-msg">読み込み中...</div></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDetail()">閉じる</button>
      <button class="btn btn-primary" id="detailReorderBtn">この内容でもう一度注文</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js?v=20260802-revive"></script>
<script>
  // 認証ガード：ログイン必須かつ小売店ロールのみ
  (function guardRetail() {
    const u = JSON.parse(sessionStorage.getItem('user') || '{}');
    const jwt = sessionStorage.getItem('_sb_jwt');
    if (!u.id || !jwt) { location.replace('login.html'); return; }
    try { const p = getJwtPayload(); if (!p || p.exp * 1000 < Date.now()) { signOut('login.html'); return; } } catch {}
    if (u.role !== 'retail') { location.replace(u.role === 'super_admin' ? 'super-dashboard.html' : 'dashboard.html'); }
  })();

  function sbFetch(path, options = {}) {
    const token = getAccessToken();
    return fetch(SB_URL + path, {
      ...options,
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
  }

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
  }

  function fmtDate(d) {
    if (!d) return '';
    const x = new Date(d + 'T00:00:00');
    if (isNaN(x)) return esc(d);
    return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`;
  }

  // ===== 複数卸業者対応 =====
  let _activeTenantId = null;
  let _memberships = [];

  function _getUser() {
    try { return JSON.parse(sessionStorage.getItem('user') || '{}'); } catch { return {}; }
  }
  function _persistActiveTenant(tid) {
    const u = _getUser(); u.activeTenantId = tid || null;
    sessionStorage.setItem('user', JSON.stringify(u));
  }
  function _withTenant(extra) {
    const base = (_activeTenantId ? { p_tenant_id: _activeTenantId } : {});
    return JSON.stringify({ ...base, ...(extra || {}) });
  }

  async function loadMemberships() {
    try {
      const res = await sbFetch('/rest/v1/rpc/get_my_memberships', { method: 'POST', body: '{}' });
      _memberships = res.ok ? ((await res.json()) || []) : [];
    } catch(e) { console.warn('卸業者一覧の取得に失敗:', e); _memberships = []; }

    if (_memberships.length === 0) { _activeTenantId = null; return; }

    // URLの t= 指定（注文画面から引き継ぎ）> 前回選択 > 先頭
    const urlTenant = new URLSearchParams(location.search).get('t');
    const saved = _getUser().activeTenantId;
    const pick = [urlTenant, saved].find(t => t && _memberships.some(m => m.tenant_id === t));
    _activeTenantId = pick || _memberships[0].tenant_id;
    _persistActiveTenant(_activeTenantId);

    const sel = document.getElementById('wholesalerSwitch');
    if (_memberships.length >= 2 && sel) {
      sel.innerHTML = _memberships.map(m =>
        `<option value="${esc(m.tenant_id)}">${esc(m.wholesaler_name || '卸業者')}</option>`
      ).join('');
      sel.value = _activeTenantId;
      sel.style.display = '';
      const ol = document.getElementById('orderLink');
      if (ol) ol.href = 'shop.html?t=' + encodeURIComponent(_activeTenantId);
    }
  }

  async function switchWholesaler(tid) {
    if (!tid || tid === _activeTenantId) return;
    _activeTenantId = tid;
    _persistActiveTenant(tid);
    const ol = document.getElementById('orderLink');
    if (ol) ol.href = 'shop.html?t=' + encodeURIComponent(tid);
    await loadCustomer();
    await loadOrders();
  }

  async function loadCustomer() {
    try {
      const res = await sbFetch('/rest/v1/rpc/get_my_customer', { method: 'POST', body: _withTenant() });
      if (res.ok) {
        const c = (await res.json() || [])[0];
        if (c && c.company_name) document.getElementById('headerCustomer').textContent = c.company_name + ' 様';
      }
    } catch(e) { console.warn(e); }
  }

  async function loadOrders() {
    const list = document.getElementById('orderList');
    try {
      const res = await sbFetch('/rest/v1/rpc/get_my_orders', { method: 'POST', body: _withTenant() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const orders = await res.json();
      if (!orders || orders.length === 0) {
        list.innerHTML = '<div class="empty-msg">まだご注文がありません。<br><a href="shop.html" style="color:var(--orange);font-weight:700">注文する →</a></div>';
        return;
      }
      list.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-head">
            <span class="order-date">${fmtDate(o.order_date)}</span>
            <span class="order-code">${esc(o.order_code)}</span>
            <span class="order-status">${esc(o.status)}</span>
            <span class="order-spacer"></span>
            <span class="order-meta">${o.item_count}点</span>
            <span class="order-total">¥${Number(o.total).toLocaleString()}</span>
          </div>
          <div class="order-actions">
            <button class="btn" onclick="openDetail('${esc(o.order_id)}','${esc(o.order_code)}')">内容を見る</button>
            <button class="btn btn-primary" onclick="reorder('${esc(o.order_id)}')">もう一度注文</button>
          </div>
        </div>`).join('');
    } catch(e) {
      console.error(e);
      list.innerHTML = '<div class="empty-msg">履歴の読み込みに失敗しました</div>';
    }
  }

  let _detailOrderId = null;

  async function openDetail(orderId, orderCode) {
    _detailOrderId = orderId;
    document.getElementById('detailTitle').textContent = orderCode + ' の内容';
    document.getElementById('detailBody').innerHTML = '<div class="empty-msg">読み込み中...</div>';
    document.getElementById('detailReorderBtn').onclick = () => reorder(orderId);
    document.getElementById('detailModal').classList.add('open');
    try {
      const res = await sbFetch('/rest/v1/rpc/get_my_order_detail', { method: 'POST', body: JSON.stringify({ p_order_id: orderId }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const items = await res.json();
      if (!items || items.length === 0) {
        document.getElementById('detailBody').innerHTML = '<div class="empty-msg">明細がありません</div>';
        return;
      }
      document.getElementById('detailBody').innerHTML = items.map(it => `
        <div class="detail-row">
          <span class="detail-name">${esc(it.product_name)}</span>
          <span class="detail-qty">¥${Number(it.unit_price).toLocaleString()} × ${it.quantity}</span>
          <span class="detail-amount">¥${(Number(it.unit_price) * it.quantity).toLocaleString()}</span>
        </div>`).join('');
    } catch(e) {
      console.error(e);
      document.getElementById('detailBody').innerHTML = '<div class="empty-msg">明細の読み込みに失敗しました</div>';
    }
  }

  function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

  // 「もう一度注文」: 注文画面に order_id（と選択中卸業者）を渡してカートを再現
  function reorder(orderId) {
    const t = _activeTenantId ? '&t=' + encodeURIComponent(_activeTenantId) : '';
    location.href = 'shop.html?reorder=' + encodeURIComponent(orderId) + t;
  }

  (async () => {
    await loadMemberships();
    await loadCustomer();
    await loadOrders();
  })();
</script>
</body>
</html>
