<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeguRee - 請求書</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #e8630a;
    --green: #1e6641;
    --bg: #f7f3ee;
    --surface: #ffffff;
    --border: #e2d9ce;
    --text: #1a1208;
    --text-muted: #7a6a55;
    --sidebar-bg: #1a1208;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== 操作バー（印刷時非表示） ===== */
  .action-bar {
    background: var(--sidebar-bg);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .action-bar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .action-bar img { width: 100px; }

  .action-bar-title {
    color: rgba(232,213,188,0.6);
    font-size: 14px;
  }

  .action-bar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-primary { background: var(--orange); color: white; }
  .btn-primary:hover { background: #d4570a; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: rgba(232,213,188,0.9); border: 1px solid rgba(255,255,255,0.15); }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  .btn-ghost { background: transparent; color: rgba(232,213,188,0.7); }
  .btn-ghost:hover { color: white; }

  /* ===== メインコンテンツ ===== */
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  /* ===== 設定パネル ===== */
  .settings-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
  }

  .settings-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .settings-grid .full { grid-column: 1 / -1; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }

  .form-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .form-input {
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus { border-color: var(--orange); background: white; }

  .settings-save {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    align-items: center;
  }

  .save-msg {
    font-size: 14px;
    color: var(--green);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .save-msg.show { opacity: 1; }

  .btn-save {
    background: var(--green);
    color: white;
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background 0.2s;
  }

  .btn-save:hover { background: #165230; }

  /* ===== 請求書本体 ===== */
  #invoice-wrap {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* ローディング */
  .loading-state {
    padding: 80px;
    text-align: center;
    color: var(--text-muted);
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 請求書レイアウト */
  .invoice {
    padding: 36px 48px;
    font-family: 'Noto Serif JP', 'Noto Sans JP', sans-serif;
  }

  .invoice-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1.5px solid var(--text);
  }

  .invoice-title-block {}

  .invoice-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
  }

  .invoice-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    margin-top: 4px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .invoice-meta {
    text-align: right;
  }

  .invoice-meta table {
    border-collapse: collapse;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .invoice-meta td {
    padding: 3px 0 3px 20px;
    color: var(--text);
  }

  .invoice-meta td:first-child {
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 1px;
    text-align: right;
  }

  .invoice-meta td:last-child {
    font-weight: 500;
    text-align: right;
  }

  /* 請求先・発行者 */
  .invoice-parties {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    gap: 24px;
  }

  .invoice-to {
    flex: 1;
  }

  .party-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    font-family: 'Noto Sans JP', sans-serif;
    margin-bottom: 8px;
  }

  .party-name {
    font-size: 17px;
    font-weight: 700;
    font-family: 'Noto Serif JP', serif;
    color: var(--text);
    margin-bottom: 2px;
  }

  .party-name-suffix {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    font-family: 'Noto Sans JP', sans-serif;
    margin-left: 4px;
  }

  .party-address {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.8;
    margin-top: 6px;
  }

  .invoice-amount-highlight {
    background: var(--text);
    color: white;
    border-radius: 10px;
    padding: 14px 22px;
    text-align: center;
    min-width: 180px;
  }

  .amount-label {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.6;
    font-family: 'Noto Sans JP', sans-serif;
    margin-bottom: 4px;
  }

  .amount-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .amount-tax {
    font-size: 10px;
    opacity: 0.5;
    font-family: 'Noto Sans JP', sans-serif;
    margin-top: 3px;
  }

  /* 明細テーブル */
  .invoice-table-wrap {
    margin-bottom: 16px;
  }

  .invoice-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
  }

  .invoice-table thead tr {
    background: #f0ebe3;
    color: var(--text-muted);
    border-bottom: 1.5px solid #d4c9bb;
  }

  .invoice-table thead th {
    padding: 7px 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 11px;
    text-align: left;
    white-space: nowrap;
  }

  .invoice-table thead th:nth-child(n+3) { text-align: right; }
  .invoice-table thead th:last-child { text-align: center; }

  .invoice-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .invoice-table tbody tr:hover { background: #faf8f5; }

  .invoice-table tbody td {
    padding: 7px 14px;
    color: var(--text);
    font-size: 13px;
  }

  .invoice-table tbody td:not(:first-child):not(:nth-child(2)) { text-align: right; }

  .invoice-table tbody tr:nth-child(even) { background: #faf8f5; }
  .invoice-table tbody tr:hover { background: #f3ede4; }

  .invoice-table tfoot tr { background: #faf8f5; }

  .invoice-table tfoot td {
    padding: 7px 14px;
    font-size: 13px;
    text-align: right;
  }

  .invoice-table tfoot td:first-child {
    text-align: left;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 1px;
  }

  .invoice-table tfoot tr.total-row {
    background: white;
    border-top: 2px solid var(--text);
  }

  .invoice-table tfoot tr.total-row td {
    font-size: 15px;
    font-weight: 700;
    padding: 11px 14px;
  }

  /* 振込先・備考 */
  .invoice-footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-family: 'Noto Sans JP', sans-serif;
  }

  .footer-section-title {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .bank-info {
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    border-radius: 6px;
    padding: 10px 14px;
  }

  .invoice-from {
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
  }

  .invoice-from .from-name {
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Serif JP', serif;
    margin-bottom: 2px;
  }

  .invoice-stamp {
    display: inline-block;
    border: 2px solid var(--orange);
    color: var(--orange);
    border-radius: 50%;
    width: 60px;
    height: 60px;
    line-height: 56px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 8px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* ===== 切り取り線 ===== */
  .cut-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 32px;
    background: var(--bg);
    color: #aaa;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    letter-spacing: 2px;
  }
  .cut-line::before, .cut-line::after {
    content: '';
    flex: 1;
    border-top: 1px dashed #ccc;
  }

  /* ===== 御請求サマリー ===== */
  .billing-summary {
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 14px;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .summary-cells {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    flex: 1;
  }
  .summary-cell {
    flex: 1;
    padding: 8px 6px;
    border-right: 1px solid var(--border);
    text-align: center;
  }
  .summary-cell:last-child { border-right: none; }
  .summary-cell-label {
    font-size: 9px;
    color: var(--text-muted);
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary-cell-value {
    font-size: 12px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }
  .summary-total-box {
    border: 2px solid var(--orange);
    border-radius: 8px;
    padding: 8px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 130px;
  }
  .summary-total-label {
    font-size: 9px;
    color: var(--orange);
    margin-bottom: 5px;
    white-space: nowrap;
  }
  .summary-total-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--orange);
    font-family: 'Space Grotesk', sans-serif;
  }
  .unpaid-warning {
    background: #fff4ec;
    border: 1px solid var(--orange);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    color: #b34500;
    display: flex;
    align-items: center;
  }

  /* 印刷スタイル */
  @media print {
    .cut-line { background: white; color: #999; }
    .action-bar, .settings-panel, .no-print { display: none !important; }
    body { background: white; }
    .main { padding: 0; max-width: 100%; }
    #invoice-wrap { box-shadow: none; border-radius: 0; }
    .invoice { padding: 18px 32px; }
    .invoice-table tbody tr:hover { background: transparent; }
    .invoice-table thead tr { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { margin: 6mm; size: A4; }
  }
</style>
</head>
<body>

<!-- 操作バー -->
<div class="action-bar no-print">
  <div class="action-bar-left">
    <img src="https://raw.githubusercontent.com/oshigowata-sys/order-form/main/meguree_final%20(2).svg" alt="MeguRee">
    <span class="action-bar-title">請求書発行</span>
  </div>
  <div class="action-bar-right">
    <div id="unpaidWarningBar" style="display:none" class="unpaid-warning no-print">
      ⚠️ この請求書の入金が未登録です
    </div>
    <div style="display:flex;align-items:center;gap:6px" class="no-print">
      <label style="color:rgba(232,213,188,0.7);font-size:11px;white-space:nowrap">前回御請求額</label>
      <input type="text" id="prevAmountInput" inputmode="numeric" placeholder="0" readonly
        style="width:110px;padding:5px 9px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.7);font-size:13px;font-family:inherit;outline:none;cursor:default">
    </div>
    <div id="paymentInputSection" style="display:none;align-items:center;gap:6px" class="no-print">
      <span style="width:1px;height:20px;background:rgba(255,255,255,0.15);display:inline-block"></span>
      <label style="color:rgba(232,213,188,0.7);font-size:11px;white-space:nowrap">御入金金額</label>
      <input type="text" id="paidAmountInput" inputmode="numeric" placeholder="入金額" oninput="onYenInput(this)"
        style="width:110px;padding:5px 9px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;font-size:13px;font-family:inherit;outline:none">
      <button onclick="savePaidAmount()"
        style="padding:5px 12px;background:var(--green);color:white;border:none;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap">保存</button>
      <span id="paidSaveMsg" style="color:#4ade80;font-size:11px;opacity:0;transition:opacity 0.3s;white-space:nowrap"></span>
    </div>
    <a href="dashboard.html" class="btn btn-ghost">← 戻る</a>
    <a href="settings.html" class="btn btn-secondary">⚙ 発行者設定</a>
    <button class="btn btn-primary" onclick="window.print()">🖨 印刷 / PDF保存</button>
  </div>
</div>

<div class="main">

  <!-- 請求書本体 -->
  <div id="invoice-wrap">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <div>受注データを取得中...</div>
    </div>
    <div class="invoice" id="deliveryBody" style="display:none;"></div>
    <div class="cut-line" id="cutLine" style="display:none;">✂ 切り取り線</div>
    <div class="invoice" id="invoiceBody" style="display:none;"></div>
  </div>

</div>

<script src="config.js"></script>
<script src="auth.js?v=20260510-idletimer"></script>
<script>
  checkAuth();
  function yenDigits(s) { return String(s ?? '').replace(/[^0-9]/g, ''); }
  function formatYen(s) {
    const d = yenDigits(s);
    return d === '' ? '' : Number(d).toLocaleString('en-US');
  }
  function onYenInput(el) { el.value = formatYen(el.value); }

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#x27;');
  }


  function sbFetch(path, options = {}) {
    const { headers: extraHeaders, ...rest } = options;
    return fetch(SB_URL + path, {
      ...rest,
      headers: {
        'apikey': SB_ANON,
        'Authorization': 'Bearer ' + getAccessToken(),
        'Content-Type': 'application/json',
        ...(extraHeaders || {}),
      }
    });
  }

  // URLパラメータ取得
  const params = new URLSearchParams(location.search);
  const targetOrderId   = params.get('order_id');    // 単一受注UUID
  const targetCustomerId = params.get('customer_id'); // 期間請求書モード
  const targetPeriodStart = params.get('period_start');
  const targetPeriodEnd   = params.get('period_end');
  const targetInvoiceNum  = params.get('invoice_num');
  const currentUser = JSON.parse(sessionStorage.getItem('user') || '{}');
  const tenantId = currentUser.tenantId;

  // ===== 設定の読込（Supabase） =====
  let _settings = {};

  async function loadSettings() {
    try {
      const [settingsRes, banksRes] = await Promise.all([
        sbFetch(`/rest/v1/settings?tenant_id=eq.${tenantId}&select=*&limit=1`),
        sbFetch(`/rest/v1/tenant_bank_accounts?tenant_id=eq.${tenantId}&select=*&order=display_order.asc,created_at.asc`)
      ]);
      const data = settingsRes.ok ? await settingsRes.json() : [];
      const banksData = banksRes.ok ? await banksRes.json() : [];
      const s = (data && data[0]) || {};
      const legacyBank = (s.bank_name || s.bank_number || s.bank_holder)
        ? [{ bank_name: s.bank_name || '', bank_branch: s.bank_branch || '', bank_type: s.bank_type || '普通', bank_number: s.bank_number || '', bank_holder: s.bank_holder || '', bank_note: s.bank_note || '' }]
        : [];
      const bankAccounts = (Array.isArray(banksData) && banksData.length > 0 ? banksData : legacyBank)
        .map(b => ({
          bank_name: b.bank_name || '',
          bank_branch: b.bank_branch || '',
          bank_type: b.bank_type || '普通',
          bank_number: b.bank_number || '',
          bank_holder: b.bank_holder || '',
          bank_note: b.bank_note || ''
        }));
      _settings = {
        name:         s.company_name       || '',
        person:       s.company_person     || '',
        address:      (s.company_zip ? '〒' + s.company_zip + ' ' : '') + (s.company_address || ''),
        tel:          s.company_tel        || '',
        fax:          s.company_fax        || '',
        email:        s.company_email      || '',
        invoice_num:  s.company_invoice_no || '',
        bank_accounts: bankAccounts,
        payment_days: s.payment_days       || 30,
      };
    } catch(e) {
      console.error('設定読込エラー', e);
    }
    return _settings;
  }

  function renderBankBlock(bankAccounts) {
    const banks = (bankAccounts || []).filter(b => b.bank_name || b.bank_branch || b.bank_number || b.bank_holder || b.bank_note);
    if (banks.length === 0) return '（振込先情報を設定してください）';
    return banks.map((bank, index) => {
      const lines = [];
      if (bank.bank_name || bank.bank_branch) lines.push(esc([bank.bank_name, bank.bank_branch].filter(Boolean).join(' ')));
      if (bank.bank_type || bank.bank_number) lines.push(esc([bank.bank_type || '普通', bank.bank_number].filter(Boolean).join('  ')));
      if (bank.bank_holder) lines.push('口座名義: ' + esc(bank.bank_holder));
      if (bank.bank_note) lines.push(`<span style="font-size:11px;color:var(--text-muted);">${esc(bank.bank_note)}</span>`);
      return `<div${index > 0 ? ' style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);"' : ''}>${lines.join('<br>')}</div>`;
    }).join('');
  }

  // ===== 請求書番号生成 =====
  function generateInvoiceNo(orderId) {
    if (orderId && /^INV-/.test(orderId)) return orderId;
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const base = orderId ? orderId.replace('ORD-', '') : String(d.getTime()).slice(-6);
    return `INV-${y}${m}-${base}`;
  }

  // ===== 支払期限計算 =====
  function calcDueDate(orderDate, days) {
    const d = orderDate ? new Date(orderDate) : new Date();
    if (isNaN(d)) return new Date();
    d.setDate(d.getDate() + Number(days || 30));
    return d;
  }

  // ===== 金額フォーマット =====
  function fmt(n) {
    return '¥' + Number(n || 0).toLocaleString('ja-JP');
  }

  // ===== 納品書HTML生成 =====
  function renderDeliveryNote(f, items, s) {
    const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    const subtotal = items.reduce((sum, it) => sum + Number(it['小計'] || 0), 0);
    const tax8  = items.filter(i => i.isFood).reduce((s, i) => s + Math.round(Number(i['小計']||0) * 0.08), 0);
    const tax10 = items.filter(i => !i.isFood).reduce((s, i) => s + Math.round(Number(i['小計']||0) * 0.10), 0);
    const tax   = tax8 + tax10;
    const total = subtotal + tax;

    const itemRows = items.length > 0
      ? items.map(it => {
          const qty   = Number(it['数量'] || 0);
          const price = Number(it['単価'] || 0);
          const sub   = Number(it['小計'] || qty * price || 0);
          const taxLabel = it.isFood ? '8%' : '10%';
          return `<tr>
            <td style="font-size:11px;color:var(--text-muted);font-family:'Space Grotesk',sans-serif">${esc(it['商品コード'] || '—')}</td>
            <td>${esc(it['商品名'] || '-')}</td>
            <td style="text-align:right">${qty.toLocaleString()}</td>
            <td style="text-align:right">${fmt(price)}</td>
            <td style="text-align:right">${fmt(sub)}</td>
            <td style="text-align:center;font-size:11px;color:var(--text-muted)">${taxLabel}</td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="6" style="text-align:center;color:#999;padding:20px;">明細データがありません</td></tr>`;

    const fromBlock = s.name
      ? `<div style="font-size:15px;font-weight:700;font-family:'Noto Serif JP',serif">${esc(s.name)}</div>
         ${s.person ? `<div style="font-size:12px;margin-top:2px">${esc(s.person)}</div>` : ''}
         ${s.address ? `<div style="font-size:12px;color:var(--text-muted)">${esc(s.address)}</div>` : ''}
         ${s.tel ? `<div style="font-size:12px;color:var(--text-muted)">TEL: ${esc(s.tel)}</div>` : ''}
         ${s.fax ? `<div style="font-size:12px;color:var(--text-muted)">FAX: ${esc(s.fax)}</div>` : ''}
         ${s.invoice_num ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px">適格請求書番号: ${esc(s.invoice_num)}</div>` : ''}`
      : `<div style="color:#aaa;font-size:13px;">⚙ 発行者情報を設定してください</div>`;

    document.getElementById('deliveryBody').innerHTML = `
      <div class="invoice-header">
        <div class="invoice-title-block">
          <div class="invoice-title">納 品 書</div>
          <div class="invoice-subtitle">DELIVERY NOTE</div>
        </div>
        <div class="invoice-meta">
          <table>
            <tr><td>納品日</td><td>${esc(today)}</td></tr>
            ${f['受注ID'] ? `<tr><td>受注ID</td><td>${esc(f['受注ID'])}</td></tr>` : ''}
          </table>
        </div>
      </div>
      <div class="invoice-parties">
        <div class="invoice-to">
          <div class="party-label">納品先 / DELIVER TO</div>
          <div class="party-name">${esc(f['取引先名'] || '取引先名')}<span class="party-name-suffix">御中</span></div>
          ${f['担当者名'] ? `<div class="party-address">${esc(f['担当者名'])} 様</div>` : ''}
          ${f['住所'] ? `<div class="party-address" style="font-size:12px;color:var(--text-muted)">${esc(f['住所'])}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div style="font-size:10px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">発行者 / ISSUED BY</div>
          ${fromBlock}
        </div>
      </div>
      <div class="invoice-table-wrap">
        <table class="invoice-table">
          <thead>
            <tr>
              <th style="width:90px">商品コード</th>
              <th>商品名</th>
              <th style="text-align:right;width:52px">数量</th>
              <th style="text-align:right;width:90px">単価</th>
              <th style="text-align:right;width:90px">金額</th>
              <th style="text-align:center;width:46px">税率</th>
            </tr>
          </thead>
          <tbody>${itemRows}</tbody>
          <tfoot>
            <tr><td colspan="2">税抜合計</td><td colspan="4">${fmt(subtotal)}</td></tr>
            ${tax8  > 0 ? `<tr><td colspan="2">消費税（8%）</td><td colspan="4">${fmt(tax8)}</td></tr>` : ''}
            ${tax10 > 0 ? `<tr><td colspan="2">消費税（10%）</td><td colspan="4">${fmt(tax10)}</td></tr>` : ''}
            <tr class="total-row"><td colspan="2">合計（税込）</td><td colspan="4">${fmt(total)}</td></tr>
          </tfoot>
        </table>
      </div>
      <div class="invoice-footer">
        <div>
          <div class="footer-section-title">振込先 / BANK TRANSFER</div>
          <div class="bank-info">${renderBankBlock(s.bank_accounts)}</div>
        </div>
      </div>
    `;
  }

  // ===== 請求書HTML生成 =====
  function renderInvoice(order, items, showDelivery = true, prevInvoice = null, currentInvoice = null) {
    window._orderData = { order, items };
    const s = _settings;
    const f = order.fields || order;

    const invoiceNo = generateInvoiceNo(f['受注ID']);
    const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    const dueDate = calcDueDate(f['受注日'], s.payment_days).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

    // 明細から合計を再計算（8%/10% 自動判定）
    const subtotal = items.reduce((sum, it) => sum + (Number(it['小計'] || it['subtotal'] || 0)), 0);
    const tax8  = items.filter(i => i.isFood).reduce((s, i) => s + Math.round(Number(i['小計']||i['subtotal']||0) * 0.08), 0);
    const tax10 = items.filter(i => !i.isFood).reduce((s, i) => s + Math.round(Number(i['小計']||i['subtotal']||0) * 0.10), 0);
    const tax = tax8 + tax10;
    const total = subtotal + tax;
    const taxLabel = tax8 > 0 && tax10 > 0 ? '消費税（8%/10%）込み' : tax8 > 0 ? '消費税（8%）込み' : '消費税（10%）込み';

    // 明細行
    const itemRows = items.length > 0
      ? items.map(it => {
          const qty = Number(it['数量'] || 0);
          const price = Number(it['単価'] || 0);
          const sub = Number(it['小計'] || qty * price || 0);
          const rate = it.isFood ? '8%' : '10%';
          return `
            <tr>
              <td style="font-size:11px;color:var(--text-muted);font-family:'Space Grotesk',sans-serif">${esc(it['商品コード'] || '—')}</td>
              <td>${esc(it['商品名'] || '-')}</td>
              <td style="text-align:right">${qty.toLocaleString()}</td>
              <td style="text-align:right">${fmt(price)}</td>
              <td style="text-align:right">${fmt(sub)}</td>
              <td style="text-align:center;font-size:11px;color:var(--text-muted)">${rate}</td>
            </tr>`;
        }).join('')
      : `<tr><td colspan="6" style="text-align:center;color:#999;padding:20px;">明細データがありません</td></tr>`;

    // 発行者情報
    const fromBlock = s.name
      ? `<div class="from-name">${esc(s.name)}</div>
         ${s.person ? `<div>${esc(s.person)}</div>` : ''}
         ${s.address ? `<div>${esc(s.address)}</div>` : ''}
         ${s.tel ? `<div>TEL: ${esc(s.tel)}</div>` : ''}
         ${s.fax ? `<div>FAX: ${esc(s.fax)}</div>` : ''}
         ${s.email ? `<div>${esc(s.email)}</div>` : ''}
         ${s.invoice_num ? `<div style="margin-top:6px;font-size:11px;color:var(--text-muted)">適格請求書番号: ${esc(s.invoice_num)}</div>` : ''}`
      : `<div style="color:#aaa;font-size:13px;">⚙ 発行者情報を設定してください</div>`;

    // 振込先情報
    const bankBlock = renderBankBlock(s.bank_accounts);

    document.getElementById('invoiceBody').innerHTML = `
      <div class="invoice-header">
        <div class="invoice-title-block">
          <div class="invoice-title">請 求 書</div>
          <div class="invoice-subtitle">INVOICE</div>
        </div>
        <div class="invoice-meta">
          <table>
            <tr><td>請求書番号</td><td>${esc(invoiceNo)}</td></tr>
            <tr><td>発行日</td><td>${esc(today)}</td></tr>
            <tr><td>締め日</td><td>${f['締め日'] != null ? '毎月' + esc(String(f['締め日'])) + '日締め' : '<span style="color:#dc2626;font-size:11px">未設定（取引先マスタで設定してください）</span>'}</td></tr>
            <tr><td>お支払い期限</td><td>${esc(dueDate)}</td></tr>
            ${f['受注ID'] ? `<tr><td>受注ID</td><td>${esc(f['受注ID'])}</td></tr>` : ''}
          </table>
        </div>
      </div>

      <div class="invoice-parties" style="margin-bottom:18px;">
        <div class="invoice-to">
          <div class="party-label">請求先 / BILL TO</div>
          <div class="party-name" style="font-size:19px;">${esc(f['取引先名'] || '取引先名')}</div>
          ${f['住所'] ? `<div class="party-address">${esc(f['住所'])}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="footer-section-title" style="margin-bottom:6px;">発行者 / ISSUED BY</div>
          <div class="invoice-from">${fromBlock}</div>
        </div>
      </div>

      ${!showDelivery ? `
      <div class="billing-summary" id="billingSummary">
        <div class="summary-cells">
          <div class="summary-cell">
            <div class="summary-cell-label">前回御請求額</div>
            <div class="summary-cell-value" id="sumPrev">—</div>
          </div>
          <div class="summary-cell">
            <div class="summary-cell-label">御入金金額</div>
            <div class="summary-cell-value" id="sumPaid">—</div>
          </div>
          <div class="summary-cell">
            <div class="summary-cell-label">繰越金額</div>
            <div class="summary-cell-value" id="sumCarry">—</div>
          </div>
          <div class="summary-cell">
            <div class="summary-cell-label">今回御買上額</div>
            <div class="summary-cell-value" id="sumThisTotal">—</div>
          </div>
          <div class="summary-cell">
            <div class="summary-cell-label">税抜御買上額</div>
            <div class="summary-cell-value" id="sumExcl">—</div>
          </div>
          <div class="summary-cell">
            <div class="summary-cell-label">消費税</div>
            <div class="summary-cell-value" id="sumTax">—</div>
          </div>
        </div>
        <div class="summary-total-box">
          <div class="summary-total-label">今回御請求額</div>
          <div class="summary-total-value" id="sumGrandTotal">—</div>
        </div>
      </div>` : ''}

      <div class="invoice-table-wrap">
        <table class="invoice-table">
          <thead>
            <tr>
              <th style="width:90px">商品コード</th>
              <th>商品名</th>
              <th style="text-align:right;width:52px">数量</th>
              <th style="text-align:right;width:90px">単価</th>
              <th style="text-align:right;width:90px">金額</th>
              <th style="text-align:center;width:46px">税率</th>
            </tr>
          </thead>
          <tbody>${itemRows}</tbody>
          <tfoot>
            <tr><td colspan="2">小計</td><td colspan="4">${fmt(subtotal)}</td></tr>
            ${tax8  > 0 ? `<tr><td colspan="2">消費税（8%）</td><td colspan="4">${fmt(tax8)}</td></tr>` : ''}
            ${tax10 > 0 ? `<tr><td colspan="2">消費税（10%）</td><td colspan="4">${fmt(tax10)}</td></tr>` : ''}
            <tr class="total-row">
              <td colspan="2">合計（税込）</td>
              <td colspan="4">${fmt(total)}</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="invoice-footer">
        <div>
          <div class="footer-section-title">振込先 / BANK TRANSFER</div>
          <div class="bank-info">${bankBlock}</div>
          ${f['備考'] ? `<div style="margin-top:16px;"><div class="footer-section-title">備考</div><div style="font-size:13px;line-height:1.8;color:var(--text-muted);">${esc(f['備考'])}</div></div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="invoice-stamp">発行済</div>
        </div>
      </div>
    `;

    // 合計をグローバルに保存（updateBillingSummary用）
    window._invoiceTotals = { subtotal, tax, total, prevPaidAmount: prevInvoice != null ? prevInvoice.paid_amount : undefined };

    // 前回請求額を操作バーにセット（表示のみ・readonly）
    const prevEl = document.getElementById('prevAmountInput');
    if (prevEl) prevEl.value = prevInvoice && prevInvoice.total_incl_tax != null ? formatYen(prevInvoice.total_incl_tax) : '';

    // 今開いている請求書への入金登録
    window._currentInvoiceNum = currentInvoice?.invoice_number || null;

    // 入金未登録警告（現在の請求書が未入金の場合）
    const warnEl = document.getElementById('unpaidWarningBar');
    if (warnEl) warnEl.style.display = (currentInvoice && currentInvoice.paid_amount == null) ? 'flex' : 'none';

    // 入金登録セクション（現在の請求書番号がある場合のみ表示）
    if (currentInvoice?.invoice_number) {
      const section = document.getElementById('paymentInputSection');
      if (section) {
        section.style.display = 'flex';
        const inputEl = document.getElementById('paidAmountInput');
        if (inputEl && currentInvoice.paid_amount != null) {
          inputEl.value = formatYen(currentInvoice.paid_amount);
        }
      }
    }

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('invoiceBody').style.display = 'block';
    if (showDelivery) {
      // 納品書兼請求書モード：請求サマリ関連UIを非表示
      const warnBar = document.getElementById('unpaidWarningBar');
      if (warnBar) warnBar.style.display = 'none';
      const prevWrap = document.getElementById('prevAmountInput')?.parentElement;
      if (prevWrap) prevWrap.style.display = 'none';
      const paySection = document.getElementById('paymentInputSection');
      if (paySection) paySection.style.display = 'none';

      document.getElementById('deliveryBody').style.display = 'block';
      document.getElementById('cutLine').style.display = 'flex';
      document.title = `納品書兼請求書 - ${f['取引先名'] || '取引先'} - ${invoiceNo}`;
      renderDeliveryNote(f, items, s);
    } else {
      document.title = `請求書 - ${f['取引先名'] || '取引先'} - ${invoiceNo}`;
      updateBillingSummary();
    }
  }

  function updateBillingSummary() {
    const t = window._invoiceTotals;
    if (!t) return;
    const prevAmount = Number(yenDigits(document.getElementById('prevAmountInput')?.value)) || 0;
    const paidAmount = t.prevPaidAmount;
    const carryOver  = (paidAmount != null) ? Math.max(0, prevAmount - paidAmount) : prevAmount;
    const grandTotal = carryOver + t.total;

    document.getElementById('sumPrev').textContent      = fmt(prevAmount);
    document.getElementById('sumPaid').textContent      = (paidAmount != null) ? fmt(paidAmount) : '未登録';
    document.getElementById('sumCarry').textContent     = fmt(carryOver);
    document.getElementById('sumThisTotal').textContent = fmt(t.total);
    document.getElementById('sumExcl').textContent      = fmt(t.subtotal);
    document.getElementById('sumTax').textContent       = fmt(t.tax);
    document.getElementById('sumGrandTotal').textContent = fmt(grandTotal);

    const paidEl = document.getElementById('sumPaid');
    if (paidEl) paidEl.style.color = (paidAmount == null) ? '#dc2626' : '';
  }

  // ===== 御入金金額の登録（前回請求書へ保存） =====
  async function savePaidAmount() {
    const curNum = window._currentInvoiceNum;
    if (!curNum) return;
    const input = document.getElementById('paidAmountInput');
    const val = input ? yenDigits(input.value) : '';
    if (val === '' || isNaN(Number(val)) || Number(val) < 0) return;
    const numVal = Number(val);
    const res = await sbFetch(
      '/rest/v1/invoices?invoice_number=eq.' + encodeURIComponent(curNum),
      { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ paid_amount: numVal }) }
    );
    const msg = document.getElementById('paidSaveMsg');
    if (res.ok) {
      if (msg) { msg.textContent = '✓ 保存しました'; msg.style.opacity = '1'; setTimeout(() => { msg.style.opacity = '0'; }, 2500); }
      // 入金済みになったので警告バーを非表示
      const warnEl = document.getElementById('unpaidWarningBar');
      if (warnEl) warnEl.style.display = 'none';
    } else {
      if (msg) { msg.textContent = '❌ 保存失敗'; msg.style.color = '#f87171'; msg.style.opacity = '1'; setTimeout(() => { msg.style.opacity = '0'; msg.style.color = '#4ade80'; }, 3000); }
    }
  }

  // ===== データ取得（Supabase）=====
  async function loadInvoiceData() {
    try {
      let orders;

      if (targetCustomerId && targetPeriodStart && targetPeriodEnd) {
        // ── 期間請求書モード（invoice-list.html の PDF ボタンから） ──
        const res = await sbFetch(
          '/rest/v1/orders?customer_id=eq.' + encodeURIComponent(targetCustomerId) +
          '&order_date=gte.' + targetPeriodStart + '&order_date=lte.' + targetPeriodEnd +
          '&select=id,order_code,order_date,customers(company_name,contact_name),order_items(quantity,unit_price,products(product_code,product_name,is_food))'
        );
        if (!res.ok) throw new Error('HTTP ' + res.status);
        orders = await res.json();

        if (!orders || orders.length === 0) {
          document.getElementById('loadingState').innerHTML = '<div style="padding:80px;text-align:center;color:#999;">対象期間に受注データがありませんでした</div>';
          return;
        }

        // 全受注の明細を結合
        const firstOrder = orders[0];

        // 取引先詳細・前回請求書・現在の請求書を並行取得
        const [custRes, prevRes, curRes] = await Promise.all([
          sbFetch('/rest/v1/customers?id=eq.' + encodeURIComponent(targetCustomerId) + '&select=address,closing_day&limit=1'),
          sbFetch(
            '/rest/v1/invoices?customer_id=eq.' + encodeURIComponent(targetCustomerId) +
            '&period_end=lt.' + encodeURIComponent(targetPeriodEnd) +
            '&select=invoice_number,total_incl_tax,paid_amount,period_end&order=period_end.desc&limit=1'
          ),
          targetInvoiceNum
            ? sbFetch('/rest/v1/invoices?invoice_number=eq.' + encodeURIComponent(targetInvoiceNum) + '&select=paid_amount&limit=1')
            : Promise.resolve(null),
        ]);

        let customerExtra = {};
        if (custRes.ok) { const d = await custRes.json(); customerExtra = d[0] || {}; }

        let prevInvoice = null;
        if (prevRes.ok) { const d = await prevRes.json(); prevInvoice = d[0] || null; }

        let currentInvoicePaidAmount = null;
        if (curRes && curRes.ok) { const d = await curRes.json(); if (d[0]) currentInvoicePaidAmount = d[0].paid_amount; }

        const currentInvoice = targetInvoiceNum ? { invoice_number: targetInvoiceNum, paid_amount: currentInvoicePaidAmount } : null;

        const f = {
          '受注ID':   targetInvoiceNum || '',
          '取引先名': firstOrder.customers?.company_name || '',
          '担当者名': firstOrder.customers?.contact_name || '',
          '受注日':   targetPeriodEnd || '',
          '住所':     customerExtra.address || '',
          '締め日':   customerExtra.closing_day != null ? customerExtra.closing_day : null,
        };
        const allItems = orders.flatMap(o =>
          (o.order_items || []).map(it => ({
            '商品コード': it.products?.product_code || '',
            '商品名': it.products?.product_name || '',
            '数量':   it.quantity || 0,
            '単価':   it.unit_price || 0,
            '小計':   (it.quantity || 0) * (it.unit_price || 0),
            isFood:   it.products?.is_food || false,
          }))
        );

        renderInvoice({ fields: f }, allItems, false, prevInvoice, currentInvoice);

      } else {
        // ── 単一受注モード ──
        let query;
        if (targetOrderId) {
          query = '/rest/v1/orders?id=eq.' + encodeURIComponent(targetOrderId);
        } else {
          query = '/rest/v1/orders?order=created_at.desc&limit=1';
        }
        query += '&select=id,order_code,order_date,customers(company_name,contact_name,address,closing_day),order_items(quantity,unit_price,products(product_code,product_name,is_food))';

        const res = await sbFetch(query);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        orders = await res.json();

        if (!orders || orders.length === 0) {
          document.getElementById('loadingState').innerHTML = '<div style="padding:80px;text-align:center;color:#999;">受注データが見つかりませんでした</div>';
          return;
        }

        const order = orders[0];
        const f = {
          '受注ID':   order.order_code || order.id,
          '取引先名': order.customers?.company_name || '',
          '担当者名': order.customers?.contact_name || '',
          '受注日':   order.order_date || '',
          '住所':     order.customers?.address || '',
          '締め日':   order.customers?.closing_day != null ? order.customers?.closing_day : null,
        };
        const items = (order.order_items || []).map(it => ({
          '商品名': it.products?.product_name || '',
          '数量':   it.quantity || 0,
          '単価':   it.unit_price || 0,
          '小計':   (it.quantity || 0) * (it.unit_price || 0),
          isFood:   it.products?.is_food || false,
        }));
        renderInvoice({ fields: f }, items);
      }

    } catch(e) {
      document.getElementById('loadingState').innerHTML = `<div style="padding:80px;text-align:center;color:#999;">データ取得エラー: ${esc(e.message)}</div>`;
    }
  }

  // 初期化（設定を先に取得してから請求書を描画）
  loadSettings().then(() => loadInvoiceData());
</script>
